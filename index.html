<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎤 Voice Shopping Assistant</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 800px;
      width: 100%;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 32px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .header p {
      opacity: 0.9;
      font-size: 14px;
    }

    .content {
      padding: 30px 20px;
    }

    .voice-section {
      background: #f8f9fa;
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 25px;
      text-align: center;
    }

    .mic-button {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-size: 48px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }

    .mic-button:hover {
      transform: scale(1.05);
      box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
    }

    .mic-button.listening {
      animation: pulse 1.5s infinite;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 10px 30px rgba(245, 87, 108, 0.4);
      }
      50% {
        transform: scale(1.1);
        box-shadow: 0 15px 40px rgba(245, 87, 108, 0.8);
      }
    }

    .transcript {
      background: white;
      border: 2px solid #e9ecef;
      border-radius: 10px;
      padding: 15px;
      min-height: 50px;
      margin-bottom: 15px;
      font-size: 16px;
      color: #495057;
      font-style: italic;
    }

    .transcript.active {
      border-color: #667eea;
      background: #f0f4ff;
    }

    .status {
      font-size: 14px;
      color: #6c757d;
      margin-bottom: 10px;
    }

    .status.listening {
      color: #f5576c;
      font-weight: 600;
    }

    .response-message {
      background: #e7f3ff;
      border-left: 4px solid #667eea;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 15px;
      color: #0c5aa0;
    }

    .response-message.success {
      background: #d4edda;
      border-left-color: #28a745;
      color: #155724;
    }

    .response-message.error {
      background: #f8d7da;
      border-left-color: #dc3545;
      color: #721c24;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid #e9ecef;
    }

    .tab-button {
      padding: 12px 20px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: #6c757d;
      border-bottom: 3px solid transparent;
      transition: all 0.3s ease;
      margin-bottom: -2px;
    }

    .tab-button.active {
      color: #667eea;
      border-bottom-color: #667eea;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .shopping-list {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 20px;
    }

    .list-item {
      background: white;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
    }

    .item-info {
      flex: 1;
    }

    .item-name {
      font-weight: 600;
      color: #212529;
      font-size: 16px;
      margin-bottom: 5px;
    }

    .item-details {
      font-size: 13px;
      color: #6c757d;
    }

    .item-actions {
      display: flex;
      gap: 10px;
    }

    .item-button {
      background: #dc3545;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .item-button:hover {
      background: #c82333;
      transform: scale(1.05);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #6c757d;
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .suggestions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
    }

    .suggestion-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .suggestion-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
    }

    .suggestion-label {
      font-size: 12px;
      opacity: 0.8;
      margin-bottom: 5px;
    }

    .suggestion-name {
      font-weight: 600;
      font-size: 14px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .stat-label {
      font-size: 12px;
      opacity: 0.9;
    }

    .clear-button {
      background: #dc3545;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      width: 100%;
    }

    .clear-button:hover {
      background: #c82333;
      transform: scale(1.02);
    }

    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @media (max-width: 600px) {
      .header h1 {
        font-size: 24px;
      }

      .mic-button {
        width: 100px;
        height: 100px;
        font-size: 36px;
      }

      .suggestions-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .tabs {
        flex-wrap: wrap;
      }

      .tab-button {
        padding: 10px 15px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎤 Voice Shopping Assistant</h1>
      <p>Talk naturally to manage your shopping list</p>
    </div>

    <div class="content">
      <div class="voice-section">
        <button class="mic-button" id="micButton" title="Click to speak or allow microphone access">🎤</button>
        <div class="status" id="status">Ready to listen</div>
        <div class="transcript" id="transcript" placeholder="Your voice commands will appear here..."></div>
      </div>

      <div id="responseMessage" class="response-message" style="display: none;"></div>

      <div class="tabs">
        <button class="tab-button active" data-tab="list">📋 My List</button>
        <button class="tab-button" data-tab="suggestions">💡 Suggestions</button>
        <button class="tab-button" data-tab="search">🔍 Search</button>
      </div>

      <div id="list" class="tab-content active">
        <div id="listContainer"></div>
      </div>

      <div id="suggestions" class="tab-content">
        <div id="suggestionsContainer"></div>
      </div>

      <div id="search" class="tab-content">
        <input type="text" id="searchInput" placeholder="Search for products..." style="width: 100%; padding: 10px; border: 2px solid #e9ecef; border-radius: 8px; margin-bottom: 15px; font-size: 14px;">
        <div id="searchResults"></div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:5000';
    const userId = 'user-' + Date.now();
    
    let recognition;
    let isListening = false;

    // Initialize Web Speech API
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isListening = true;
        document.getElementById('micButton').classList.add('listening');
        document.getElementById('status').classList.add('listening');
        document.getElementById('status').textContent = '🔴 Listening...';
        document.getElementById('transcript').classList.add('active');
      };

      recognition.onresult = (event) => {
        let interimTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i].transcript;
          if (event.results[i].isFinal) {
            processCommand(transcript);
          } else {
            interimTranscript += transcript;
          }
        }
        document.getElementById('transcript').textContent = interimTranscript || 'Listening...';
      };

      recognition.onend = () => {
        isListening = false;
        document.getElementById('micButton').classList.remove('listening');
        document.getElementById('status').classList.remove('listening');
        document.getElementById('status').textContent = '✅ Ready to listen';
        document.getElementById('transcript').classList.remove('active');
      };

      recognition.onerror = (event) => {
        showMessage('Microphone access denied. You can still type commands.', 'error');
        document.getElementById('status').textContent = '❌ Microphone not available';
      };
    } else {
      showMessage('Speech Recognition not supported in this browser. Please use Chrome, Edge, or Safari.', 'error');
    }

    // Mic button handler
    document.getElementById('micButton').addEventListener('click', () => {
      if (!recognition) {
        showMessage('Voice recognition not available in your browser', 'error');
        return;
      }
      
      if (isListening) {
        recognition.stop();
      } else {
        document.getElementById('transcript').textContent = '';
        recognition.start();
      }
    });

    // Tab switching
    document.querySelectorAll('.tab-button').forEach(button => {
      button.addEventListener('click', (e) => {
        document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        
        e.target.classList.add('active');
        const tabName = e.target.dataset.tab;
        document.getElementById(tabName).classList.add('active');
        
        if (tabName === 'suggestions') {
          loadSuggestions();
        }
      });
    });

    // Process voice command
    async function processCommand(command) {
      document.getElementById('transcript').textContent = command;
      showMessage('Processing...', 'loading');

      try {
        const response = await fetch(`${API_URL}/api/process-command`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ command, userId })
        });

        const data = await response.json();
        
        if (data.success) {
          showMessage(data.message, 'success');
        } else {
          showMessage(data.message, 'error');
        }

        loadShoppingList();
      } catch (error) {
        showMessage('Error processing command: ' + error.message, 'error');
      }
    }

    // Load shopping list
    async function loadShoppingList() {
      try {
        const response = await fetch(`${API_URL}/api/shopping-list/${userId}`);
        const data = await response.json();
        
        const container = document.getElementById('listContainer');
        
        if (data.count === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">🛒</div>
              <p>Your shopping list is empty</p>
              <p style="font-size: 13px; margin-top: 10px;">Say "Add milk" or click the microphone to start</p>
            </div>
          `;
          return;
        }

        let html = `
          <div class="stats">
            <div class="stat-card">
              <div class="stat-value">${data.count}</div>
              <div class="stat-label">Items</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">$${data.total}</div>
              <div class="stat-label">Total Cost</div>
            </div>
          </div>
          <div class="shopping-list">
        `;

        for (const [category, items] of Object.entries(data.groupedByCategory)) {
          html += `<div style="margin-bottom: 20px;">
            <h3 style="font-size: 14px; color: #6c757d; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px;">📦 ${category}</h3>`;
          
          items.forEach(item => {
            html += `
              <div class="list-item">
                <div class="item-info">
                  <div class="item-name">${item.name}</div>
                  <div class="item-details">
                    Qty: ${item.quantity} | Price: $${(item.price * item.quantity).toFixed(2)}
                  </div>
                </div>
                <div class="item-actions">
                  <button class="item-button" onclick="removeItem('${item.name}')">Remove</button>
                </div>
              </div>
            `;
          });
          html += '</div>';
        }

        html += `</div>
          <button class="clear-button" onclick="clearList()" style="margin-top: 20px;">Clear All Items</button>
        `;

        container.innerHTML = html;
      } catch (error) {
        document.getElementById('listContainer').innerHTML = `
          <div class="empty-state">
            <p style="color: #dc3545;">Error loading list: ${error.message}</p>
          </div>
        `;
      }
    }

    // Load suggestions
    async function loadSuggestions() {
      try {
        const response = await fetch(`${API_URL}/api/suggestions`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId })
        });

        const data = await response.json();
        const container = document.getElementById('suggestionsContainer');

        let html = '';

        if (data.complementary && data.complementary.length > 0) {
          html += `<h3 style="margin-bottom: 15px; color: #212529;">💡 Complementary Items</h3>
            <div class="suggestions-grid">`;
          data.complementary.forEach(item => {
            html += `
              <div class="suggestion-card" onclick="addFromSuggestion('${item}')">
                <div class="suggestion-label">Add</div>
                <div class="suggestion-name">${item}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        if (data.seasonal && data.seasonal.length > 0) {
          html += `<h3 style="margin-top: 25px; margin-bottom: 15px; color: #212529;">🌽 Seasonal Items</h3>
            <div class="suggestions-grid">`;
          data.seasonal.forEach(item => {
            html += `
              <div class="suggestion-card" onclick="addFromSuggestion('${item}')">
                <div class="suggestion-label">Add</div>
                <div class="suggestion-name">${item}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        if (!html) {
          html = `
            <div class="empty-state">
              <div class="empty-state-icon">💭</div>
              <p>Add items to your list to see suggestions</p>
            </div>
          `;
        }

        container.innerHTML = html;
      } catch (error) {
        document.getElementById('suggestionsContainer').innerHTML = `
          <div class="empty-state">
            <p style="color: #dc3545;">Error loading suggestions: ${error.message}</p>
          </div>
        `;
      }
    }

    // Remove item from list
    async function removeItem(itemName) {
      await processCommand(`Remove ${itemName}`);
    }

    // Clear entire list
    async function clearList() {
      if (confirm('Are you sure you want to clear your entire shopping list?')) {
        try {
          await fetch(`${API_URL}/api/shopping-list/${userId}`, { method: 'DELETE' });
          loadShoppingList();
          showMessage('Shopping list cleared', 'success');
        } catch (error) {
          showMessage('Error clearing list: ' + error.message, 'error');
        }
      }
    }

    // Add from suggestion
    function addFromSuggestion(item) {
      processCommand(`Add ${item}`);
    }

    // Show message
    function showMessage(message, type = 'info') {
      const element = document.getElementById('responseMessage');
      element.textContent = message;
      element.className = 'response-message ' + type;
      element.style.display = 'block';

      if (type !== 'loading') {
        setTimeout(() => {
          element.style.display = 'none';
        }, 3000);
      }
    }

    // Search functionality
    document.getElementById('searchInput').addEventListener('input', async (e) => {
      const query = e.target.value.trim();
      if (query.length < 2) {
        document.getElementById('searchResults').innerHTML = '';
        return;
      }

      try {
        const response = await fetch(`${API_URL}/api/search/${query}`);
        const data = await response.json();
        
        let html = '';
        if (data.count === 0) {
          html = '<p style="color: #6c757d;">No products found</p>';
        } else {
          html = '<div class="suggestions-grid">';
          data.results.forEach(product => {
            html += `
              <div class="suggestion-card" onclick="addFromSuggestion('${product.name}')">
                <div class="suggestion-label">$${product.price}</div>
                <div class="suggestion-name">${product.name}</div>
              </div>
            `;
          });
          html += '</div>';
        }
        document.getElementById('searchResults').innerHTML = html;
      } catch (error) {
        document.getElementById('searchResults').innerHTML = `<p style="color: #dc3545;">Error: ${error.message}</p>`;
      }
    });

    // Initial load
    loadShoppingList();
  </script>
</body>
</html>
